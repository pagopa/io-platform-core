name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@d025f45d6725b88af4a7b6e391f4ae13d58af13c # main
    with:
      environment: app-prod-cd
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}