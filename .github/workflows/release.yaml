name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@abb37e552370c4b3e2e5b2601c76a307f421c074 # main
    with:
      environment: app-prod-cd
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}