openapi: 3.1.0
info:
  title: io-example-func
  version: 0.0.1
  description: Example Azure Functions app following the hexagonal architecture pattern.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:7071/api
    description: Local development server

security: []

paths:
  /info:
    get:
      operationId: getInfo
      summary: Health check / application info
      description: Returns the application name, version, and health status.
      tags:
        - Info
      responses:
        "200":
          description: Application info returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoOutput"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /greetings/{name}:
    get:
      operationId: getGreeting
      summary: Get a greeting by name
      description: Returns a greeting message for the given name.
      security:
        - functionKey: []
      tags:
        - Greetings
      parameters:
        - name: name
          in: path
          required: true
          description: The name to greet.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Greeting returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greeting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /greetings:
    post:
      operationId: postGreeting
      summary: Create a greeting
      description: Creates and returns a greeting message for the given name.
      security:
        - functionKey: []
      tags:
        - Greetings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostGreetingRequest"
      responses:
        "200":
          description: Greeting created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greeting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    functionKey:
      type: apiKey
      in: header
      name: x-functions-key
      description: Azure Functions host key passed as the `x-functions-key` header.

  schemas:
    Greeting:
      type: object
      description: A greeting message with its creation timestamp.
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
          description: The greeting message text.
          example: Hello, Alice!
        timestamp:
          type: string
          description: ISO 8601 timestamp of when the greeting was created.
          example: "2026-04-03T10:00:00.000Z"

    InfoOutput:
      type: object
      description: Application health and version information.
      required:
        - name
        - ok
        - version
      properties:
        name:
          type: string
          description: The application name.
          example: io-example-func
        ok:
          type: boolean
          description: Whether the application is healthy.
          example: true
        version:
          type: string
          description: The application version.
          example: 0.0.1

    PostGreetingRequest:
      type: object
      description: Request body for creating a greeting.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: The name to greet.
          example: Alice

    ProblemDetails:
      type: object
      description: >
        RFC 7807 Problem Details for HTTP APIs.
        See https://tools.ietf.org/html/rfc7807.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: >
            A URI reference that identifies the problem type.
            Base URL: https://ioapp.it/problems/
          example: https://ioapp.it/problems/not-found
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Not Found
        status:
          type: integer
          description: The HTTP status code.
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: "Unable to find Greeting: name not found"

  responses:
    BadRequest:
      description: The request input failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://ioapp.it/problems/validation-error
            title: Validation Error
            status: 400
            detail: "Validation error: name must not be empty"

    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://ioapp.it/problems/not-found
            title: Not Found
            status: 404
            detail: "Unable to find Greeting: name not found"

    InternalServerError:
      description: An unexpected server-side error occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://ioapp.it/problems/generic-error
            title: Internal Server Error
            status: 500
            detail: "Generic error: an unexpected error occurred"
