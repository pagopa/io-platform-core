openapi: 3.1.0
info:
  title: io-example-func
  version: 0.0.1
  description: Example Azure Functions app following the hexagonal architecture pattern.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:7071/api
    description: Local development server

security: []

paths:
  /info:
    get:
      operationId: getInfo
      summary: Health check / application info
      description: Returns the application name, version, and health status.
      tags:
        - Info
      responses:
        "200":
          description: Application info returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoOutput"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /user-profiles:
    get:
      operationId: getUserProfile
      summary: Get a user profile by fiscal code
      description: Returns the user profile associated with the given fiscal code.
      security:
        - functionKey: []
      tags:
        - UserProfiles
      parameters:
        - name: x-fiscal-code
          in: header
          required: true
          description: The fiscal code of the user whose profile to retrieve.
          schema:
            $ref: "#/components/schemas/FiscalCode"
      responses:
        "200":
          description: User profile returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createUserProfile
      summary: Create a new user profile
      description: Creates a new user profile with the provided data.
      security:
        - functionKey: []
      tags:
        - UserProfiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserProfileRequest"
      responses:
        "200":
          description: User profile created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: updateUserProfile
      summary: Update an existing user profile
      description: Updates the user profile identified by the fiscal code header.
      security:
        - functionKey: []
      tags:
        - UserProfiles
      parameters:
        - name: x-fiscal-code
          in: header
          required: true
          description: The fiscal code of the user whose profile to update.
          schema:
            $ref: "#/components/schemas/FiscalCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: User profile updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    functionKey:
      type: apiKey
      in: header
      name: x-functions-key
      description: Azure Functions host key passed as the `x-functions-key` header.

  schemas:
    InfoOutput:
      type: object
      description: Application health and version information.
      required:
        - name
        - ok
        - version
      properties:
        name:
          type: string
          description: The application name.
          example: io-example-func
        ok:
          type: boolean
          description: Whether the application is healthy.
          example: true
        version:
          type: string
          description: The application version.
          example: 0.0.1

    FiscalCode:
      type: string
      description: The Italian fiscal code (Codice Fiscale).
      pattern: "^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$"

    EmailAddress:
      type: string
      format: email
      description: A valid email address.
      example: mario.rossi@example.com

    UserProfile:
      type: object
      description: A user profile with personal information.
      required:
        - fiscalCode
        - email
        - name
        - createdAt
      properties:
        fiscalCode:
          $ref: "#/components/schemas/FiscalCode"
        email:
          $ref: "#/components/schemas/EmailAddress"
        name:
          type: string
          description: The user's full name.
          example: Mario Rossi
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the profile was created.
          example: "2026-01-15T10:00:00.000Z"
        updatedAt:
          type: string
          description: ISO 8601 timestamp of the last profile update.
          example: "2026-03-10T08:30:00.000Z"

    CreateUserProfileRequest:
      type: object
      description: Request body for creating a user profile.
      required:
        - fiscalCode
        - email
        - name
      properties:
        fiscalCode:
          $ref: "#/components/schemas/FiscalCode"
        email:
          $ref: "#/components/schemas/EmailAddress"
        name:
          type: string
          minLength: 1
          description: The user's full name.
          example: Mario Rossi

    UpdateUserProfileRequest:
      type: object
      description: Request body for updating a user profile. At least one field should be provided.
      properties:
        email:
          $ref: "#/components/schemas/EmailAddress"
        name:
          type: string
          minLength: 1
          description: The user's full name.
          example: Mario Rossi

    ProblemDetails:
      type: object
      description: >
        RFC 7807 Problem Details for HTTP APIs.
        See https://tools.ietf.org/html/rfc7807.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: >
            A URI reference that identifies the problem type.
            Base URL: https://ioapp.it/problems/
          example: https://ioapp.it/problems/not-found
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Not Found
        status:
          type: integer
          description: The HTTP status code.
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: "Unable to find User: name not found"

  responses:
    BadRequest:
      description: The request input failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://ioapp.it/problems/validation-error
            title: Validation Error
            status: 400
            detail: "Validation error: name must not be empty"

    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://ioapp.it/problems/not-found
            title: Not Found
            status: 404
            detail: "Unable to find User: name not found"

    InternalServerError:
      description: An unexpected server-side error occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://ioapp.it/problems/generic-error
            title: Internal Server Error
            status: 500
            detail: "Generic error: an unexpected error occurred"

    Conflict:
      description: The resource already exists.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://ioapp.it/problems/conflict
            title: Conflict
            status: 409
            detail: "Conflict: UserProfile with provided fiscal code already exists."
